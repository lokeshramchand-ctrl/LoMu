# LoMu site. Adapt the server_name and the TLS lines to your standard nginx template
# (wildcard certificate); everything below `location` blocks is what LoMu specifically needs.

server {
    listen 80;
    server_name lomu.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name lomu.example.com;

    # --- replace with your wildcard certificate paths ---
    ssl_certificate     /etc/ssl/wildcard/fullchain.pem;
    ssl_certificate_key /etc/ssl/wildcard/privkey.pem;

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Audio proxy: streamed, range-aware. No buffering, long timeouts, no compression.
    location /api/stream/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        gzip off;
    }

    # Server-sent events: one long-lived connection per open client.
    location /api/sync/events {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        gzip off;
    }
}
